<!doctype html>
<!-- The share image (og:image), 1200 x 630. Render it to design/og/og.png with:
       chrome --headless=new --hide-scrollbars --force-device-scale-factor=1 --window-size=1200,630 \
         --virtual-time-budget=8000 --screenshot=design/og/og.png file://$PWD/design/og/og.html
     The site's build copies the PNG to /assets/og.png. Same identity as the site: ink black, chrome yellow for what
     is imitated (dashed), the wordmark in Instrument Serif Italic, and two real shots of the invented demo app. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@1&display=block">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { background: #0B0B0C; color: #F5F5F2; font-family: Geist, system-ui, sans-serif; position: relative; -webkit-font-smoothing: antialiased; }
  .copy { position: absolute; left: 72px; top: 64px; width: 640px; height: 502px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand img { width: 52px; height: 52px; }
  .brand span { font-family: "Instrument Serif", serif; font-style: italic; font-size: 50px; line-height: 1; letter-spacing: -0.02em; }
  h1 { margin-top: 96px; font-size: 58px; line-height: 1.08; font-weight: 600; letter-spacing: -0.035em; }
  h1 .named { display: block; color: #A0A09A; }
  h1 .dash { color: #FFD60A; border-bottom: 4px dashed #FFD60A; padding-bottom: 2px; }
  p { margin-top: 30px; font-size: 27px; line-height: 1.35; color: #A0A09A; max-width: 480px; }
  .foot { margin-top: auto; display: flex; gap: 14px; align-items: center; font-family: "Geist Mono", monospace; font-size: 21px; color: #A0A09A; }
  .foot b { font-weight: 500; color: #F5F5F2; }
  .foot i { width: 4px; height: 4px; border-radius: 50%; background: #55555A; }
  .shots { position: absolute; right: 64px; top: 0; height: 630px; width: 400px; }
  .phone { position: absolute; width: 236px; height: 512px; border-radius: 34px; overflow: hidden; }
  .phone img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .real { left: 0; top: 96px; border: 1.5px solid #34343A; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6); }
  .echo { left: 150px; top: 44px; border: 3px dashed #FFD60A; }
  .echo img { opacity: 0.94; }
</style>
</head>
<body>
  <div class="copy">
    <div class="brand"><img src="../logo/imitor-icon-120.svg" alt=""><span>Imitor</span></div>
    <h1>Your app, imitated. <span class="named">Every <span class="dash">stand‑in</span> named.</span></h1>
    <p>See a React Native / Expo app’s UI without a simulator.</p>
    <div class="foot"><b>imitor.dev</b><i></i><span>open source, MIT</span></div>
  </div>
  <div class="shots" aria-hidden="true">
    <div class="phone real"><img src="../../demo/assets/shots/plant-details-dark.png" alt=""></div>
    <div class="phone echo"><img src="../../demo/assets/shots/today-dark.png" alt=""></div>
  </div>
</body>
</html>
