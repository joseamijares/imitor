name: Imitor gate
description: Build an Expo app's web imitation, run its flows, and fail the job if the run should block a native build.
branding:
  icon: layers
  color: yellow
inputs:
  working-directory:
    description: The app's folder (where imitor.config.json is).
    default: "."
  fail-on:
    description: "What blocks: flows (a flow failed), errors (also page errors), or stand-ins (also any shot with a stand-in)."
    default: flows
  install-browser:
    description: Install Chromium for Playwright before running. Turn off if your job already has it.
    default: "true"
  upload-report:
    description: Upload the report (page, manifest and screenshots) as an artifact, pass or fail.
    default: "true"
  artifact-name:
    description: Name of the uploaded artifact.
    default: imitor-report
  output-directory:
    description: Imitor's output folder inside the working directory ("out" in imitor.config.json).
    default: preview
  comment:
    description: >-
      On pull_request events, post the verdict and the shots as one comment on the pull request, updated in place on
      every push. Needs "permissions: contents: write" (the shots branch) and "pull-requests: write" (the comment).
      Ignored on other events. Set to "false" to turn it off.
    default: "true"
  shots-branch:
    description: Branch of this repository that holds the screenshots shown in the comment. Rewritten on every push; never your working branch.
    default: imitor-shots
  max-shots:
    description: Most shots shown per flow in the comment (one device and scheme, the first configured).
    default: "12"
outputs:
  passed:
    description: "true or false"
    value: ${{ steps.gate.outputs.passed }}
  shots:
    description: Number of shots taken
    value: ${{ steps.gate.outputs.shots }}
  failed-flows:
    description: Number of flows that failed
    value: ${{ steps.gate.outputs.failed-flows }}
  page-errors:
    description: Number of page errors seen
    value: ${{ steps.gate.outputs.page-errors }}
  stand-ins:
    description: Comma-separated stand-ins seen in shots
    value: ${{ steps.gate.outputs.stand-ins }}
runs:
  using: composite
  steps:
    - name: Install Chromium
      if: inputs.install-browser == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npx playwright install --with-deps chromium
    - name: Run the gate
      id: gate
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        IMITOR_FAIL_ON: ${{ inputs.fail-on }}
      run: npx imitor gate --fail-on "$IMITOR_FAIL_ON"
    - name: Publish the shots for the comment
      id: shots
      if: always() && inputs.comment == 'true' && github.event_name == 'pull_request' && steps.gate.outcome != 'skipped'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GITHUB_TOKEN: ${{ github.token }}
        IMITOR_SHOTS_BRANCH: ${{ inputs.shots-branch }}
        IMITOR_PR: ${{ github.event.pull_request.number }}
        IMITOR_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        # Never fails the job: without a pushable token the comment lists file paths instead of images.
        if ! npx imitor publish-shots --branch "$IMITOR_SHOTS_BRANCH" --pr "$IMITOR_PR" --sha "$IMITOR_SHA" > /dev/null; then
          echo "::notice title=Imitor: shots not published::Could not push the screenshots to the $IMITOR_SHOTS_BRANCH branch, so the comment lists file paths instead of images. The workflow needs 'permissions: contents: write' (a pull request from a fork never gets it)."
        fi
    - name: Comment on the pull request
      if: always() && inputs.comment == 'true' && github.event_name == 'pull_request' && steps.gate.outcome != 'skipped'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GH_TOKEN: ${{ github.token }}
        IMITOR_FAIL_ON: ${{ inputs.fail-on }}
        IMITOR_MAX_SHOTS: ${{ inputs.max-shots }}
        IMITOR_IMAGE_BASE: ${{ steps.shots.outputs.image-base }}
        IMITOR_PR: ${{ github.event.pull_request.number }}
        IMITOR_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        # Never fails the job: the gate's own result stays the job's result.
        notice() { echo "::notice title=Imitor: no comment::$1"; exit 0; }
        body="$(mktemp)"
        args=(--fail-on "$IMITOR_FAIL_ON" --max-shots "$IMITOR_MAX_SHOTS" --report-url "$IMITOR_RUN_URL")
        if [ -n "$IMITOR_IMAGE_BASE" ]; then args+=(--image-base "$IMITOR_IMAGE_BASE"); fi
        npx imitor comment "${args[@]}" > "$body" || notice "There is no run to comment on (did the build fail?)."
        # The one comment to update is found by its hidden marker line.
        existing="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$IMITOR_PR/comments" \
          --jq '.[] | select((.body // "") | startswith("<!-- imitor-comment -->")) | .id')" \
          || notice "Could not read the pull request's comments. The workflow needs 'permissions: pull-requests: write'."
        existing="${existing%%$'\n'*}"
        if [ -n "$existing" ]; then
          gh api --silent -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -F "body=@$body" \
            || notice "Could not update the Imitor comment. The workflow needs 'permissions: pull-requests: write' (a pull request from a fork never gets it)."
        else
          gh api --silent -X POST "repos/$GITHUB_REPOSITORY/issues/$IMITOR_PR/comments" -F "body=@$body" \
            || notice "Could not post the Imitor comment. The workflow needs 'permissions: pull-requests: write' (a pull request from a fork never gets it)."
        fi
    - name: Upload the report
      if: always() && inputs.upload-report == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        if-no-files-found: ignore
        path: |
          ${{ inputs.working-directory }}/${{ inputs.output-directory }}/index.html
          ${{ inputs.working-directory }}/${{ inputs.output-directory }}/manifest.json
          ${{ inputs.working-directory }}/${{ inputs.output-directory }}/screens
